<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Royal Housing BD redesign prototype: plots, flats and homes in Dhaka.">
<title>Royal Housing BD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Royal Housing BD — design system v3 ("Nocturne", readable) */
:root{
  --ink:#0B1411; --deep:#0F1D18; --forest:#14302A; --forest-2:#1B3B33;
  --ivory:#F3EDE2; --paper:#F7F3EC; --sand:#ECE4D6;
  --champ:#C9A96E; --champ-2:#E2CDA0; --bronze:#86652F;
  --stone:#C2BBAE; --stone-2:#DDD6C9;
  --text:#1B1F1D; --mute:#545852; --line-l:#DCD3C3; --line-d:rgba(243,237,226,.16);
  --open:#5BC28B; --booked:#E1A04F; --sold:#A9AFAB; --wa:#1F8A4C;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --e:cubic-bezier(.16,.84,.24,1);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--ivory);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--serif);font-weight:500;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
.wrap{max-width:1440px;margin:0 auto;padding-left:56px;padding-right:56px}
@media (max-width:760px){.wrap{padding-left:20px;padding-right:20px}}
.lbl{font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.c{color:var(--champ)} .b{color:var(--bronze)}
.rule{display:inline-flex;align-items:center;gap:14px}
.rule::before{content:"";width:40px;height:1px;background:currentColor}
.it{font-style:italic}
.ch{color:var(--champ-2)}
.ico{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.light{background:var(--paper);color:var(--text)}
.h1{font-size:clamp(46px,6.4vw,96px);line-height:1;letter-spacing:-.02em}
.h2{font-size:clamp(36px,4.4vw,64px);line-height:1.05;letter-spacing:-.015em}
.h3{font-size:clamp(26px,2.2vw,34px);line-height:1.15}
.lead{font-size:19px;line-height:1.65}
.muted{color:var(--stone)} .light .muted{color:var(--mute)}
.sec{padding-top:128px;padding-bottom:128px}
@media (max-width:760px){.sec{padding-top:80px;padding-bottom:80px}}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:28px;flex-wrap:wrap;margin-bottom:56px}
.sec-head>div{display:flex;flex-direction:column;gap:18px;max-width:760px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 26px;border:1px solid transparent;border-radius:2px;font-size:15px;font-weight:600;white-space:nowrap;transition:background .4s var(--e),color .4s,border-color .4s}
.btn-champ{background:var(--champ);color:var(--ink)}.btn-champ:hover{background:var(--champ-2)}
.btn-ivory{background:var(--ivory);color:var(--ink)}.btn-ivory:hover{background:#fff}
.btn-ink{background:var(--ink);color:var(--ivory)}.btn-ink:hover{background:var(--forest)}
.btn-wa{background:var(--wa);color:#fff}.btn-wa:hover{background:#18723F}
.btn-line{border-color:rgba(243,237,226,.5);color:var(--ivory)}.btn-line:hover{background:rgba(243,237,226,.1)}
.btn-line-d{border-color:var(--text);color:var(--text)}.btn-line-d:hover{background:var(--text);color:var(--ivory)}
.btn-sm{min-height:46px;padding:0 18px;font-size:14px}
.btn-block{width:100%}
.link{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:600;border-bottom:1px solid currentColor;padding-bottom:4px}
.link .ico{transition:transform .4s var(--e)}.link:hover .ico{transform:translateX(4px)}
.iconb{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;position:relative;border-radius:999px}
.iconb:hover{background:rgba(243,237,226,.1)}
.iconb .dot{position:absolute;top:8px;right:8px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--champ);color:var(--ink);font-size:10px;font-weight:700;line-height:16px;text-align:center}

/* header */
.hdr{position:relative;z-index:20;color:var(--ivory);border-bottom:1px solid var(--line-d)}
.hdr.over{position:absolute;left:0;right:0;top:0;border-color:transparent;background:linear-gradient(180deg,rgba(11,20,17,.55),rgba(11,20,17,0))}
.hdr.solid{background:var(--ink)}
.hdr .wrap{display:flex;align-items:center;gap:40px;min-height:88px}
.brand{display:flex;align-items:center;gap:12px;line-height:1}
.brand b{display:block;font-family:var(--serif);font-weight:600;font-size:23px;letter-spacing:.02em}
.brand small{display:block;margin-top:5px;font-size:10px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--champ)}
.nav{display:flex;gap:30px;font-size:15px;font-weight:500}
.nav a{position:relative;padding:8px 0;opacity:.9;display:inline-flex;align-items:center;gap:6px}
.nav a:hover{opacity:1}
.nav a.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--champ)}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:4px}
.lang{display:flex;border:1px solid var(--line-d);border-radius:999px;padding:3px;font-size:13px;margin:0 8px}
.lang span{padding:5px 11px;border-radius:999px}
.lang span.on{background:var(--ivory);color:var(--ink);font-weight:700}
.mob{display:none !important}
@media (max-width:1100px){.desk{display:none !important}.mob{display:inline-flex !important}.hdr .wrap{min-height:72px;gap:12px}.brand b{font-size:20px}.brand small{display:none}}

/* hero */
.hero{position:relative;min-height:880px;color:var(--ivory);overflow:hidden;display:flex;flex-direction:column}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,20,17,.6) 0%,rgba(11,20,17,.1) 25%,rgba(11,20,17,.35) 55%,rgba(11,20,17,.94) 100%),linear-gradient(90deg,rgba(11,20,17,.6) 0%,rgba(11,20,17,0) 65%)}
.hero .body{position:relative;margin-top:auto;padding-top:200px;padding-bottom:56px;display:flex;flex-direction:column;gap:30px;width:100%}
.hero h1{font-size:clamp(50px,7vw,108px);line-height:1.02;letter-spacing:-.02em;max-width:980px;text-shadow:0 2px 30px rgba(0,0,0,.35)}
.hero .sub{font-size:20px;line-height:1.6;max-width:620px;color:#EDE6D9}
.search{display:flex;align-items:stretch;background:rgba(247,243,236,.97);color:var(--text);max-width:1080px;box-shadow:0 30px 70px -30px rgba(0,0,0,.6);flex-wrap:wrap}
.search label{flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:4px;padding:16px 22px;border-right:1px solid var(--line-l)}
.search .k{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.search select,.search input{border:0;background:transparent;color:var(--text);font-size:17px;font-weight:500;padding:0;outline:none;width:100%}
.search button{flex:0 0 auto;border:0;background:var(--ink);color:var(--ivory);padding:0 32px;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:600;min-height:80px}
.bars{display:flex;gap:8px;align-items:center}
.bars i{display:block;width:44px;height:2px;background:rgba(243,237,226,.35)}
.bars i.on{background:var(--ivory)}

/* cards */
.card{display:flex;flex-direction:column;gap:16px;position:relative;color:inherit}
.card .media{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--forest)}
.card .media img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--e)}
.card:hover .media img{transform:scale(1.05)}
.tags{position:absolute;top:16px;left:16px;display:flex;gap:8px}
.tags span{background:rgba(11,20,17,.75);color:var(--ivory);font-size:12px;font-weight:600;padding:7px 11px;border-radius:2px}
.tags span.v{background:var(--ivory);color:var(--ink);display:inline-flex;gap:5px;align-items:center}
.save{position:absolute;top:12px;right:12px;width:44px;height:44px;border:0;border-radius:999px;background:rgba(247,243,236,.94);color:var(--ink);display:grid;place-items:center}
.card .loc{font-size:14px;color:var(--stone);display:inline-flex;gap:6px;align-items:center}
.light .card .loc{color:var(--mute)}
.card h3{font-size:28px;line-height:1.15}
.card .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-top:1px solid var(--line-d);padding-top:14px}
.light .card .row{border-color:var(--line-l)}
.card .pr{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--champ-2)}
.light .card .pr{color:var(--forest)}
.card .sp{font-size:14px;color:var(--stone)}
.light .card .sp{color:var(--mute)}
.meter{height:3px;background:var(--line-d);display:flex}
.light .meter{background:var(--line-l)}
.meter span{background:var(--booked)}
.sbar{display:flex;height:4px;background:rgba(243,237,226,.15)}
.sbar span:nth-child(1){background:var(--open)}.sbar span:nth-child(2){background:var(--booked)}.sbar span:nth-child(3){background:var(--sold)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line-d);background:transparent;font-size:14px;font-weight:600;color:var(--ivory);display:inline-flex;align-items:center;gap:6px}
.pill.on{background:var(--ivory);color:var(--ink);border-color:var(--ivory)}
.light .pill{border-color:var(--line-l);color:var(--text)}
.light .pill.on{background:var(--ink);color:var(--ivory);border-color:var(--ink)}
.pill sup{font-size:11px;opacity:.7}

/* panels (category) */
.panel{position:relative;overflow:hidden;color:var(--ivory);display:block;background:var(--forest)}
.panel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--e)}
.panel:hover img{transform:scale(1.06)}
.panel .shd{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,20,17,0) 40%,rgba(11,20,17,.85))}
.panel .cap{position:absolute;left:26px;right:26px;bottom:24px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.panel h3{font-size:36px;line-height:1.05}
.panel .cnt{display:block;margin-top:8px;font-size:14px;color:var(--stone-2)}
.panel .go{width:52px;height:52px;border-radius:999px;border:1px solid rgba(243,237,226,.6);display:grid;place-items:center}

/* glass */
.glass{background:rgba(11,20,17,.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(243,237,226,.2);padding:30px;display:flex;flex-direction:column;gap:20px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.trio div{display:flex;flex-direction:column;gap:4px}
.trio div+div{padding-left:18px;border-left:1px solid var(--line-d)}
.trio b{font-family:var(--serif);font-weight:500;font-size:44px;line-height:1}
.trio span{font-size:14px;display:flex;align-items:center;gap:8px;color:var(--stone-2)}
.dotc{width:9px;height:9px;border-radius:99px;display:inline-block;flex:0 0 auto}

/* footer */
.foot{background:var(--ink);color:var(--ivory);border-top:1px solid var(--line-d);padding-top:112px}
.foot-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:40px;font-size:15px}
.foot-cols>div{display:flex;flex-direction:column;gap:12px}
.foot-cols a{color:var(--stone-2)}.foot-cols a:hover{color:var(--champ-2)}
.word{font-family:var(--serif);font-weight:500;font-size:clamp(56px,12.4vw,200px);line-height:.85;letter-spacing:-.03em;white-space:nowrap;text-align:center;margin-top:96px}
.foot-base{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:14px;color:var(--stone);padding-top:28px;padding-bottom:32px;border-top:1px solid var(--line-d);margin-top:40px}

/* advisor fab */
.fabwrap{display:flex;flex-direction:column;align-items:flex-end;gap:16px}
.fabrow{display:flex;align-items:center;gap:14px}
.fablbl{background:var(--paper);color:var(--text);font-size:15px;font-weight:600;padding:12px 20px;border-radius:999px;box-shadow:0 14px 30px -14px rgba(0,0,0,.45)}
.fab{position:relative;width:64px;height:64px;border-radius:999px;border:0;background:var(--champ);color:var(--ink);display:grid;place-items:center;box-shadow:0 18px 36px -12px rgba(0,0,0,.55)}
.fab::before,.fab::after{content:"";position:absolute;inset:-8px;border-radius:999px;border:1px solid rgba(201,169,110,.55);animation:ring 2.6s var(--e) infinite}
.fab::after{inset:-16px;border-color:rgba(201,169,110,.3);animation-delay:.6s}
@keyframes ring{0%{transform:scale(.85);opacity:0}40%{opacity:1}100%{transform:scale(1.15);opacity:0}}
.fab.open{background:var(--ink);color:var(--champ-2)}
.fabcard{width:360px;max-width:calc(100vw - 32px);background:var(--paper);color:var(--text);padding:26px;display:flex;flex-direction:column;gap:12px;box-shadow:0 40px 80px -30px rgba(0,0,0,.65);border-top:3px solid var(--champ)}
.fabcard h4{font-size:24px}

/* filters */
.fpanel{display:flex;flex-direction:column;gap:30px}
.fgroup{display:flex;flex-direction:column;gap:12px;padding-bottom:26px;border-bottom:1px solid var(--line-l)}
.fgroup h4{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.chk{display:flex;align-items:center;gap:12px;min-height:40px;font-size:15px;cursor:pointer;border:0;background:none;padding:0;color:var(--text);text-align:left;width:100%}
.chk .box{width:22px;height:22px;border:1.5px solid #9C9585;border-radius:3px;display:grid;place-items:center;flex:0 0 auto}
.chk.on .box{background:var(--ink);border-color:var(--ink);color:var(--ivory)}
.chk .n{margin-left:auto;font-size:13px;color:var(--mute)}
.chk.zero{opacity:.45}
.radio .box{border-radius:99px}
.selrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--mute)}
.field select,.field input{height:50px;border:1px solid var(--line-l);background:#fff;padding:0 14px;font-size:15px;font-weight:500;color:var(--text);border-radius:2px}
.chipx{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 8px 0 14px;border:1px solid var(--line-l);border-radius:999px;font-size:14px;background:#fff}

/* sheets */
.sheet{background:var(--paper);color:var(--text);padding:32px;display:flex;flex-direction:column;gap:18px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6)}
.tabs2{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line-l)}
.tabs2 span{text-align:center;padding:14px 0;font-weight:600;font-size:15px;color:var(--mute)}
.tabs2 span.on{color:var(--text);box-shadow:inset 0 -2px 0 var(--ink)}

/* tab bar (mobile) */
.tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:rgba(11,20,17,.97);border-top:1px solid var(--line-d);padding:6px 6px 10px}
.tabbar a{min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;color:var(--stone-2)}
.tabbar a.on{color:var(--champ-2)}
.live{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--ivory);font-size:13px;font-weight:600;padding:9px 14px}
.live i{width:8px;height:8px;border-radius:9px;background:var(--open)}

/* ---- prototype layer ---- */
:root{color-scheme:dark}
html{scroll-behavior:smooth}
body{overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--ink)}
.wrap{padding-left:max(56px,env(safe-area-inset-left,0px));padding-right:max(56px,env(safe-area-inset-right,0px))}
@media (max-width:760px){.wrap{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}}
:focus-visible{outline:2px solid var(--champ);outline-offset:3px}
#hdr{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:60}
.hdr{transition:background .5s var(--e),border-color .5s}
.hdr.over{position:relative}
.hdr.scrolled{background:rgba(11,20,17,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--line-d)}
.spacer{height:88px}
@media (max-width:1100px){.spacer{height:72px}}
.nav button{border:0;background:none;padding:8px 0;font-size:15px;font-weight:500;display:inline-flex;align-items:center;gap:6px;position:relative;opacity:.9}
.nav button.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--champ)}
.dd{position:absolute;top:56px;left:-24px;width:300px;background:var(--paper);color:var(--text);padding:10px;display:flex;flex-direction:column;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);border-top:3px solid var(--champ);animation:up .35s var(--e)}
.dd a{display:flex;justify-content:space-between;padding:13px 14px;font-size:15px;font-weight:500}
.dd a:hover{background:var(--sand)}
.dd a span{color:var(--mute);font-size:13px}
.lang button{border:0;background:none;padding:5px 11px;border-radius:999px;font-size:13px;color:inherit}
.lang button[aria-pressed="true"]{background:var(--ivory);color:var(--ink);font-weight:700}
.light .lang button[aria-pressed="true"]{background:var(--ink);color:var(--ivory)}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@keyframes fd{from{opacity:0}}
@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1)}}
.view{animation:fd .6s var(--e)}
.zoom{overflow:hidden}.zoom img{transition:transform 1.4s var(--e)}.zoom:hover img{transform:scale(1.05)}

/* hero slideshow */
.hero .slide{position:absolute;inset:0;opacity:0;transition:opacity 1.6s var(--e)}
.hero .slide.on{opacity:1}
.hero .slide img{width:100%;height:100%;object-fit:cover;transform:scale(1.08);transition:transform 8s linear}
.hero .slide.on img{transform:scale(1)}
.hero{min-height:min(100svh,980px);min-height:max(700px,min(100svh,980px))}
.bars button{width:44px;height:20px;border:0;background:none;padding:0;position:relative}
.bars button::before{content:"";position:absolute;left:0;right:0;top:9px;height:2px;background:rgba(243,237,226,.35)}
.bars button[aria-pressed="true"]::before{background:var(--ivory)}
.rise{animation:up 1.1s var(--e) both}.rise.d1{animation-delay:.1s}.rise.d2{animation-delay:.2s}.rise.d3{animation-delay:.3s}
@media (max-width:760px){
 .hero{min-height:720px}
 .hero .body{padding-bottom:120px;gap:18px}
 .hero h1{font-size:42px}
 .hero .sub{font-size:16px}
 .search label{flex:1 1 45%;padding:12px 14px}
 .search label:nth-of-type(2){border-right:0}
 .search label:nth-of-type(3){flex:1 1 100%;border-right:0;border-top:1px solid var(--line-l)}
 .search button{flex:1 1 100%;min-height:56px}
 .hero-foot .slides-ui{display:none}
}

/* layouts */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(460px,100%),1fr));gap:64px;align-items:center}
.stats4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line-l)}
.stats4>div{padding:30px 24px 0;display:flex;flex-direction:column;gap:6px;border-left:1px solid var(--line-l)}
.stats4>div:first-child{padding-left:0;border-left:0}
.stats4 b{font-family:var(--serif);font-weight:500;font-size:clamp(44px,5vw,72px);line-height:1;color:var(--forest)}
.stats4 span{font-size:16px;color:var(--mute)}
@media (max-width:760px){.stats4{grid-template-columns:repeat(2,minmax(0,1fr))}.stats4>div{padding:20px 0 20px 16px!important}.stats4>div:nth-child(odd){padding-left:0!important;border-left:0}.stats4>div:nth-child(-n+2){border-bottom:1px solid var(--line-l)}}
.types{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:300px;gap:20px}
.types .big{grid-column:span 2;grid-row:span 2}
.types .wide{grid-column:span 4}

function layer(html,mount){const el=$('#layer');el.innerHTML=html;const prev=document.activeElement;document.body.style.overflow='hidden';
 const close=()=>{el.innerHTML='';document.body.style.overflow='';document.removeEventListener('keydown',k);prev&&prev.focus&&prev.focus({preventScroll:true})};

 el.onclick=e=>{if(e.target.closest('[data-close]')||e.target.classList.contains('scrim'))close()};
 const f=el.querySelector('input,button,a');f&&f.focus({preventScroll:true});mount&&mount(el,close);return close}

  <form id="af" style="display:flex;flex-direction:column;gap:16px">${tab==='up'?'<label class="field" for="a-n">Your name (optional)<input id="a-n" autocomplete="name"></label>':''}<label class="field" for="a-id">Email or mobile number<input id="a-id" autocomplete="username" placeholder="you@example.com or 01XXX-XXXXXX"></label><label class="field" for="a-pw">Password<input id="a-pw" type="password" autocomplete="${tab==='in'?'current-password':'new-password'}"></label>
  ${tab==='in'?'<div style="display:flex;justify-content:space-between;align-items:center;font-size:14px"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox"> Remember me</label><a href="'+LIVE+'/forgot-password" target="_blank" rel="noopener" style="color:var(--bronze);font-weight:600">Forgot password?</a></div>':''}
  <button class="btn btn-ink btn-block" type="submit">${tab==='in'?'Log in':'Create account'}</button><p style="font-size:13px;color:var(--mute);text-align:center">By continuing you agree to our terms and privacy policy.</p></form>
  ${saved.length?`<div style="border-top:1px solid var(--line-l);padding-top:16px;display:flex;flex-direction:column;gap:10px"><b>Saved on this device (${saved.length})</b>${saved.map(l=>`<a href="#p-${l.id}" data-close style="display:flex;gap:12px;align-items:center"><img src="${I+l.img}" alt="" style="width:64px;height:48px;object-fit:cover"><span style="font-size:15px">${esc(l.title)}</span></a>`).join('')}</div>`:''}`;
  b.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{tab=x.dataset.tab;draw(root)});
  b.querySelector('#af').addEventListener('submit',e=>{e.preventDefault();toast('Prototype preview: log in and sign up work on the live site')});};
 layer(`<div class="scrim center" role="dialog" aria-modal="true" aria-label="My account"><div class="modal" style="width:min(480px,100%)"><div class="mhead"><div><h3>Welcome back</h3><p style="font-size:15px;color:var(--mute);margin-top:6px">Your saved properties are kept in your account, on any device.</p></div><button class="xb" data-close aria-label="Close">${ic('x',18)}</button></div><div id="ab" style="display:flex;flex-direction:column;gap:18px"></div></div></div>`,el=>draw(el));}
function menu(){let open=true;
 const draw=root=>{root.querySelector('#mn').innerHTML=`<a href="#home" data-close>Home</a><a href="#projects" data-close>Projects</a><button class="big" data-mtog aria-expanded="${open}">Listings${ic(open?'chevu':'chev')}</button>${open?`<div class="sub" style="display:flex;flex-direction:column;padding:4px 0 10px 16px;border-left:1px solid var(--line-d);margin-bottom:6px">${TYPES.map(t=>`<a href="#listings-${t[0]}" data-close>${t[1]}</a>`).join('')}</div>`:''}<a href="#masterplan" data-close>Project Map</a><a href="#gallery" data-close>Gallery</a><a href="#about" data-close>About</a>`;
  root.querySelector('[data-mtog]').onclick=()=>{open=!open;draw(root)}};
 layer(`<div class="drawer" role="dialog" aria-modal="true" aria-label="Menu"><div style="display:flex;align-items:center;justify-content:space-between"><b style="font-family:var(--serif);font-size:21px;font-weight:600">Royal Housing</b><button class="iconb" data-close aria-label="Close menu" style="border:1px solid var(--line-d)">${ic('x')}</button></div><nav id="mn" aria-label="Menu" style="display:flex;flex-direction:column;margin-top:26px"></nav>
 <div style="margin-top:auto;padding-top:28px;display:flex;flex-direction:column;gap:14px"><div style="display:flex;justify-content:space-between;align-items:center"><div class="lang" role="group" aria-label="Language" style="margin:0"><button data-lang="en" aria-pressed="${S.lang==='en'}">EN</button><button data-lang="bn" aria-pressed="${S.lang==='bn'}">বাং</button></div><button data-act="dark" style="border:0;background:none;font-size:14px;color:var(--stone-2);display:flex;gap:8px;align-items:center">${ic('moon',17)}Dark mode</button></div><a href="#consult" data-consult class="btn btn-champ btn-block">Book free consultation</a><a href="#home" data-act="account" class="btn btn-line btn-block">${ic('user',17)}Log in or sign up</a><span style="font-size:14px;color:var(--stone)">Hotline: <span style="color:var(--ivory);user-select:all">+880 1700-000000</span></span></div></div>`,el=>draw(el));}
function notes(){layer(`<div class="scrim" style="background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;animation:none"><div class="pop" role="dialog" aria-label="Notifications"><p class="lbl b" style="padding:12px 14px 6px">Notifications</p>${NOTES.map(n=>`<div class="note"><b>${n[0]} <span style="background:var(--champ);color:var(--ink);font-size:10px;font-weight:700;padding:2px 6px;margin-left:4px">NEW</span></b><span>${n[1]}</span><small>${n[2]}</small></div>`).join('')}</div></div>`)}
function photo(list,i){let k=i;const draw=root=>{const p=list[k];root.querySelector('#ph').innerHTML=`<img src="${I+p[0]}" alt="${esc(p[1])}" style="max-width:100%;max-height:76svh;object-fit:contain"><div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;color:var(--ivory)">${list.length>1?'<button class="btn btn-line btn-sm" data-pv>Previous</button>':''}<span style="font-size:15px">${esc(p[1])}${p[2]?' · '+p[2]:''} (${k+1} of ${list.length})</span>${list.length>1?'<button class="btn btn-line btn-sm" data-nx>Next</button>':''}<button class="btn btn-ivory btn-sm" data-close>Close</button></div>`;
  const pv=root.querySelector('[data-pv]'),nx=root.querySelector('[data-nx]');pv&&(pv.onclick=()=>{k=(k-1+list.length)%list.length;draw(root)});nx&&(nx.onclick=()=>{k=(k+1)%list.length;draw(root)})};
 layer(`<div class="scrim center" role="dialog" aria-modal="true" aria-label="Photo viewer" style="background:rgba(5,10,8,.94);align-items:center;padding:20px"><div id="ph" style="display:flex;flex-direction:column;align-items:center;gap:18px;max-width:1400px;width:100%"></div></div>`,el=>draw(el));}
function fsheet(){layer(`<div class="scrim" role="dialog" aria-modal="true" aria-label="Filters"><div class="fsheet"><div style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line-l)"><h3 style="font-size:26px">Filters</h3><span style="display:flex;gap:12px;align-items:center"><button data-act="clear" style="border:0;background:none;font-size:14px;font-weight:600;color:var(--bronze)">Clear all</button><button class="xb" data-close aria-label="Close filters">${ic('x',18)}</button></span></div><div class="body" id="fsb">${filterPanel()}</div><div style="padding:14px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line-l);background:#fff"><button class="btn btn-ink btn-block" data-close id="fsn">Show ${results().length} properties</button></div></div></div>`)}

/* ---------- router ---------- */
let clean=[];
function render(){const h=(location.hash||'#home').slice(1);
 if(h==='consult'){if(!$('#app').innerHTML){S.route='home';paint()}consult();return}
 const anchor=h.match(/^(home|about)-(.+)$/);
 if(anchor){const r=anchor[1];if(S.route!==r||!$('#app').innerHTML){S.route=r;paint()}setTimeout(()=>{const t=document.getElementById(h);t&&t.scrollIntoView({behavior:'smooth'})},80);return}
 if(h.startsWith('listings')){S.route='listings';const t=h.split('-')[1];S.lcat=TYPES.some(x=>x[0]===t)?t:'plot'}
 else if(h.startsWith('p-'))S.route=h;
 else if(['projects','masterplan','gallery','about'].includes(h))S.route=h;
 else S.route='home';
 paint();window.scrollTo(0,0)}
function paintFab(){$('#fab').innerHTML=fab()}
function paintHdr(){$('#hdr').innerHTML=header();onScroll()}
function paint(){clean.forEach(f=>f());clean=[];S.dd=false;S.fab=false;$('#layer').innerHTML='';document.body.style.overflow='';
 const r=S.route;
 paintHdr();
 $('#app').innerHTML=`<div class="view">${r==='home'?vHome():r==='projects'?vProjects():r==='listings'?vListings():r==='masterplan'?vMap():r==='gallery'?vGallery():r==='about'?vAbout():vDetail(r.slice(2))}</div>`;
 $('#foot').innerHTML=r==='masterplan'?'':footer();
 $('#tabbar').innerHTML=tabbar();paintFab();
 const t=TYPES.find(x=>x[0]===S.lcat);
 document.title={home:'Royal Housing BD — Plots, flats & homes in Dhaka',projects:'All projects · Royal Housing BD',listings:(t?t[2]:'Listings')+' · Royal Housing BD',masterplan:'Dhaka Icon City project map · Royal Housing BD',gallery:'Gallery · Royal Housing BD',about:'About · Royal Housing BD'}[r]||((L.find(l=>'p-'+l.id===r)||{}).title+' · Royal Housing BD');
 if(r==='home')wireHome();if(r==='projects')wireProjects();if(r==='masterplan')clean.push(wireMap());}
function onScroll(){const hd=$('#hd');if(hd&&isHero())hd.classList.toggle('scrolled',scrollY>40)}
addEventListener('scroll',onScroll,{passive:true});
function wireHome(){const f=$('#hs');
 const read=()=>{const b=HB[+$('#h-bud').value];return {q:$('#h-q').value.trim(),type:$('#h-type').value,locs:[],min:b[1],max:b[2],feats:[],sort:'new'}};
 const upd=()=>{const F=read();const n=L.filter(l=>match(l,null,F)).length;$('#h-n').textContent=`Show ${n} ${n===1?'property':'properties'}`};
 f.addEventListener('input',upd);f.addEventListener('change',upd);
 f.addEventListener('submit',e=>{e.preventDefault();S.F=read();location.hash='projects'});
 const go=i=>{S.slide=i;$$('.hero .slide').forEach((s,j)=>s.classList.toggle('on',j===i));$$('[data-slide]').forEach((b,j)=>b.setAttribute('aria-pressed',j===i));const sl=$('#sl');if(sl)sl.textContent=`0${i+1} / 04 · ${SLIDES[i][1]}`};
 const tm=setInterval(()=>go((S.slide+1)%SLIDES.length),6500);clean.push(()=>clearInterval(tm));
 $$('[data-slide]').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.slide)));}
function wireProjects(){const q=$('#pq');let t;q.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(()=>{S.F.q=q.value.trim();$('#res').innerHTML=resultsHTML();$('#fp').innerHTML=filterPanel()},180)})}
function wireMap(){const st=$('#stage'),im=$('#mpi');let z=.6,x=0,y=0,d=null;
 const ap=()=>{im.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(${z})`};
 const fit=()=>{z=Math.max(.3,Math.min(st.clientWidth/1600*1.1,1.2));x=0;y=0;ap()};
 const zb=k=>{z=Math.max(.3,Math.min(2.8,z*(k>0?1.25:.8)));ap()};
 st.querySelectorAll('[data-zoom]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();+b.dataset.zoom?zb(+b.dataset.zoom):fit()}));
 st.addEventListener('pointerdown',e=>{if(e.target.closest('.ctrl,label'))return;d={sx:e.clientX,sy:e.clientY,x,y};st.setPointerCapture(e.pointerId)});
 st.addEventListener('pointermove',e=>{if(!d)return;x=d.x+e.clientX-d.sx;y=d.y+e.clientY-d.sy;ap()});
 const up=()=>d=null;st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
 st.addEventListener('wheel',e=>{e.preventDefault();zb(e.deltaY<0?1:-1)},{passive:false});
 fit();const ro=new ResizeObserver(fit);ro.observe(st);return()=>ro.disconnect()}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const tg=e.target;
 if(S.dd&&!tg.closest('[data-act="dd"],.dd')){S.dd=false;paintHdr()}
 const c=tg.closest('[data-consult]');if(c){e.preventDefault();$('#layer').innerHTML='';consult();return}
 const sv=tg.closest('[data-save]');if(sv){e.preventDefault();const id=sv.dataset.save;S.saved[id]?delete S.saved[id]:S.saved[id]=1;try{localStorage.setItem('rh-saved',JSON.stringify(S.saved))}catch(_){}
  toast(S.saved[id]?'Saved. Find it under the profile icon.':'Removed from saved');const y=scrollY;
  if(S.route==='projects'){refreshProjects()}else{const r=S.route;$('#app').innerHTML=`<div>${r==='home'?vHome():r==='listings'?vListings():vDetail(r.slice(2))}</div>`;if(r==='home')wireHome()}window.scrollTo(0,y);return}
 const pre=tg.closest('[data-pre]');if(pre){S.F={q:'',type:pre.dataset.pre,locs:[],min:0,max:0,feats:[],sort:'new'}}
 const hc=tg.closest('[data-hcat]');if(hc){S.homeCat=hc.dataset.hcat;$$('[data-hcat]').forEach(b=>{const on=b.dataset.hcat===S.homeCat;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});const show=S.homeCat==='All'?[L[2],L[3],L[4],L[1],L[0]]:L.filter(l=>l.type===S.homeCat);$('#hlist').innerHTML=show.map(l=>card(l,true)).join('');return}
 const fq=tg.closest('[data-faq]');if(fq){const i=+fq.dataset.faq;S.faq=S.faq===i?-1:i;$('#faqs').innerHTML=faqHTML();return}
 const ft=tg.closest('[data-ftype]');if(ft){S.F.type=ft.dataset.ftype;refreshProjects();return}
 const fl=tg.closest('[data-floc]');if(fl){const v=fl.dataset.floc;S.F.locs=S.F.locs.includes(v)?S.F.locs.filter(x=>x!==v):S.F.locs.concat([v]);refreshProjects();return}
 const ff=tg.closest('[data-ffeat]');if(ff){const v=ff.dataset.ffeat;S.F.feats=S.F.feats.includes(v)?S.F.feats.filter(x=>x!==v):S.F.feats.concat([v]);refreshProjects();return}
 const uc=tg.closest('[data-unchip]');if(uc){const v=uc.dataset.unchip;if(v==='type')S.F.type='All types';else if(v==='bud'){S.F.min=0;S.F.max=0}else if(v==='q'){S.F.q='';const q=$('#pq');if(q)q.value=''}else if(v.startsWith('loc:'))S.F.locs=S.F.locs.filter(x=>x!==v.slice(4));else if(v.startsWith('feat:'))S.F.feats=S.F.feats.filter(x=>x!==v.slice(5));refreshProjects();return}
 const gc=tg.closest('[data-gcat]');if(gc){S.gcat=gc.dataset.gcat;const y=scrollY;$('#app').innerHTML=`<div>${vGallery()}</div>`;window.scrollTo(0,y);return}
 const gi=tg.closest('[data-gi]');if(gi){photo(gList(),+gi.dataset.gi);return}
 const ph=tg.closest('[data-photo]');if(ph){const l=L.find(x=>'p-'+x.id===S.route);const list=l?[l.img].concat(l.gal).map(s=>[s,l.title,'']):[[ph.dataset.photo,'Photo','']];photo(list,Math.max(0,list.findIndex(p=>p[0]===ph.dataset.photo)));return}
 const lg=tg.closest('[data-leg]');if(lg){const k=lg.dataset.leg;S.hidden[k]=!S.hidden[k];lg.setAttribute('aria-pressed',!S.hidden[k]);return}
 const la=tg.closest('[data-lang]');if(la){S.lang=la.dataset.lang;$$('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===S.lang));if(S.lang==='bn')toast('বাংলা: the live site switches every label using its existing translations');return}
 const a=tg.closest('[data-act]');if(!a)return;const k=a.dataset.act;
 if(k==='dd'){S.dd=!S.dd;paintHdr()}
 if(k==='fab'){S.fab=!S.fab;paintFab()}
 if(k==='menu')menu();if(k==='notes')notes();if(k==='account'){e.preventDefault();account()}if(k==='fsheet')fsheet();
 if(k==='dark')toast('Dark mode carries over from the live site');
 if(k==='call')toast('Hotline: +880 1700-000000');
 if(k==='video')toast('The project walkthrough video plays here');
 if(k==='share'){try{navigator.clipboard.writeText(location.href).then(()=>toast('Link copied'),()=>toast('Copy the link from the address bar'))}catch(_){toast('Copy the link from the address bar')}}
 if(k==='clear'){S.F={q:'',type:'All types',locs:[],min:0,max:0,feats:[],sort:'new'};const q=$('#pq');if(q)q.value='';refreshProjects()}
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.matches('[data-fmin]')){S.F.min=+t.value;refreshProjects()}
 if(t.matches('[data-fmax]')){S.F.max=+t.value;refreshProjects()}
 if(t.matches('[data-fsort]')){S.F.sort=t.value;refreshProjects()}
 if(t.matches('[data-lbud]')){S.lbud=+t.value;const y=scrollY;$('#app').innerHTML=`<div>${vListings()}</div>`;window.scrollTo(0,y)}
 if(t.matches('[data-lsort]')){S.lsort=t.value;const y=scrollY;$('#app').innerHTML=`<div>${vListings()}</div>`;window.scrollTo(0,y)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.fab){S.fab=false;paintFab()}if(S.dd){S.dd=false;paintHdr()}}});
addEventListener('hashchange',render);
render();
})();
</script>

</body>
</html>
